name: Deploy to dev library

# Installs every push to a non-main branch into the MBPRICE1 dev library on
# pub400, via the same scripts/ibmi-deploy.sh + scripts/ibmi-compile.sh used
# by the test pipeline (see AGENTS.md — these are the only permitted way to
# deploy/compile against pub400). Runs against its own IFS checkout
# (todo-dev, from the dev GitHub Environment) so it never resets/cleans the todo-test checkout
# used by the MBPRICE2 pipeline on main.
#
# workflow_dispatch is kept alongside the push trigger so a run can be
# retried or validated on demand without needing a new commit.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ibmi-dev-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-compile:
    runs-on: ubuntu-latest
    # Library + IFS checkout come from the "dev" GitHub Environment
    # (Settings -> Environments): IBMI_CURLIB=MBPRICE1, IBMI_IFS_DIR=todo-dev.
    environment: dev
    env:
      IBMI_USER: ${{ secrets.IBMI_USER }}
      IBMI_CURLIB: ${{ vars.IBMI_CURLIB }}
      IBMI_IFS_DIR: ${{ vars.IBMI_IFS_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write CI SSH identity
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.IBMI_SSH_KEY }}" > ~/.ssh/ibmi_ci_key
          chmod 600 ~/.ssh/ibmi_ci_key
          echo "IBMI_IDENTITY=$HOME/.ssh/ibmi_ci_key" >> "$GITHUB_ENV"

      - name: Deploy to ${{ vars.IBMI_CURLIB }} (dev library)
        run: bash scripts/ibmi-deploy.sh "${{ github.sha }}"

      - name: Compile in ${{ vars.IBMI_CURLIB }} (dev library)
        run: bash scripts/ibmi-compile.sh
